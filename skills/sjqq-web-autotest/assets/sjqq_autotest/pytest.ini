[pytest]
# 测试用例目录
testpaths = tests
# 仅收集独立成文件的 web 用例，方便后续增删维护
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 报告与稳定性配置
# 唯一报告(reports/应用宝官网自动化测试报告.html)：由 core/report_builder 在 session 结束时生成，
#   内嵌每步截图、参考 Allure 风格、自包含单文件，直接发给业务人员。
# --reruns: 动态网页偶发失败自动重试一次，降低误报
# -ra: 汇总所有用例结果（passed/skipped/failed）
# 有头/无头由 config/settings.py 的 HEADED（或环境变量 SJQQ_HEADED）控制，
# 默认有头（HEADED=True）：执行时打开可见 Chrome 窗口，逐步操作可被人工观看。
addopts =
    -v
    --reruns 1
    --reruns-delay 2
    -ra

# pytest-base-url 插件使用的基准地址（session 级）
base_url = https://sj.qq.com/

# 自定义标记，便于按需筛选执行
markers =
    smoke: 冒烟用例（核心链路）
    search: 搜索相关用例
    nav: 导航/分类用例
    detail: 应用详情/下载用例
    ui: 页面元素/响应式用例
